services:
  # ── API Backend ──
  # Postgres é o supabase-db compartilhado (DB: appsindico)
  appsindico-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: appsindico-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: supabase-db
      DB_PORT: "5432"
      DB_NAME: appsindico
      DB_USER: appsindico
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: https://appsindico.com.br
      FRONTEND_URL: https://appsindico.com.br
    volumes:
      - uploads:/app/uploads
    networks:
      - coolify
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend Nginx ──
  appsindico-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appsindico-app
    restart: unless-stopped
    depends_on:
      - appsindico-api
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appsindico-https.rule=Host(`appsindico.com.br`) || Host(`www.appsindico.com.br`)"
      - "traefik.http.routers.appsindico-https.entrypoints=https"
      - "traefik.http.routers.appsindico-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.appsindico.loadbalancer.server.port=8080"
      - "traefik.http.routers.appsindico-https.priority=1"
      - "traefik.http.routers.appsindico-http.rule=Host(`appsindico.com.br`) || Host(`www.appsindico.com.br`)"
      - "traefik.http.routers.appsindico-http.entrypoints=http"
      - "traefik.http.routers.appsindico-http.middlewares=appsindico-redirect-https"
      - "traefik.http.middlewares.appsindico-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.routers.appsindico-www.rule=Host(`www.appsindico.com.br`)"
      - "traefik.http.routers.appsindico-www.entrypoints=https"
      - "traefik.http.routers.appsindico-www.tls=true"
      - "traefik.http.routers.appsindico-www.middlewares=appsindico-redirect-www"
      - "traefik.http.middlewares.appsindico-redirect-www.redirectregex.regex=^https://www\\.appsindico\\.com\\.br/(.*)"
      - "traefik.http.middlewares.appsindico-redirect-www.redirectregex.replacement=https://appsindico.com.br/$${1}"
      - "traefik.http.middlewares.appsindico-redirect-www.redirectregex.permanent=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Backup automático (pg_dump diário do DB appsindico no supabase-db) ──
  appsindico-backup:
    image: postgres:16-alpine
    container_name: appsindico-backup
    restart: unless-stopped
    environment:
      PGDATABASE: appsindico
      PGUSER: appsindico
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
      PGHOST: supabase-db
      PGPORT: "5432"
    volumes:
      - backups:/var/backups/appsindico
    networks:
      - coolify
    entrypoint: >
      sh -c "while true; do
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
        echo \"[$$(date)] Iniciando backup...\";
        pg_dump --no-owner --no-privileges | gzip > /var/backups/appsindico/appsindico_$$TIMESTAMP.sql.gz;
        find /var/backups/appsindico -name 'appsindico_*.sql.gz' -mtime +30 -delete;
        echo \"[$$(date)] Backup concluído.\";
        sleep 86400;
      done"

volumes:
  uploads:
  backups:

networks:
  coolify:
    external: true
